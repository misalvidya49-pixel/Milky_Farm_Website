<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | MILKY FARM</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background: #eef8f1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-container {
            width: 950px;
            max-width: 100%;

            min-height: 570px;

            background: white;

            border-radius: 22px;
            overflow: hidden;

            box-shadow:
                0 15px 45px rgba(0, 80, 30, 0.15);

            display: flex;
        }

        /* =========================
           LEFT SIDE
        ========================= */

        .register-left {

            width: 50%;

            min-height: 570px;

            position: relative;

            overflow: hidden;

            color: white;

            padding: 35px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            background: #178a47;
        }

        .register-left::before {

            content: "";

            position: absolute;

            inset: 0;

            background-image:
                url("{{ url_for('static', filename='images/milky_farm_login_background_clean.png') }}");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            z-index: 0;
        }

        .register-left::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    rgba(23, 138, 71, 0.28),
                    rgba(23, 138, 71, 0.28)
                );

            z-index: 1;
        }

        .register-left > * {

            position: relative;

            z-index: 2;
        }

        /* =========================
           LOGO
        ========================= */

        .farm-logo {

            width: 145px;
            height: 145px;

            object-fit: contain;

            border-radius: 50%;

            background: white;

            padding: 5px;

            margin-bottom: 18px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);
        }

        .register-left h1 {

            font-size: 38px;

            letter-spacing: 1px;

            margin-bottom: 8px;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.45);
        }

        .farm-line {

            width: 65px;

            height: 3px;

            background: white;

            border-radius: 10px;

            margin: 5px 0 15px;
        }

        .register-left h2 {

            font-size: 20px;

            font-weight: normal;

            margin-bottom: 18px;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.45);
        }

        .register-left p {

            font-size: 14px;

            line-height: 1.6;

            max-width: 340px;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.45);
        }

        /* =========================
           RIGHT SIDE
        ========================= */

        .register-right {

            width: 50%;

            padding: 45px 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            background: white;
        }

        .register-right h2 {

            color: #126b32;

            font-size: 31px;

            margin-bottom: 8px;
        }

        .register-subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-group {

            margin-bottom: 17px;
        }

        .input-group label {

            display: block;

            color: #333;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .input-group input {

            width: 100%;

            height: 47px;

            padding: 0 15px;

            border:
                1px solid #d5e4d9;

            border-radius: 11px;

            outline: none;

            background: #fbfdfb;

            color: #333;

            font-size: 14px;

            transition: 0.3s;
        }

        .input-group input:focus {

            border-color: #159447;

            box-shadow:
                0 0 0 4px
                rgba(21,148,71,0.08);

            background: white;
        }

        /* =========================
           REGISTER BUTTON
        ========================= */

        .register-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 11px;

            background: #11863f;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }

        .register-btn:hover {

            background: #0b6d31;

            transform: translateY(-1px);
        }

        /* =========================
           LOGIN LINK
        ========================= */

        .login-text {

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 14px;
        }

        .login-text a {

            color: #11863f;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {

            text-decoration: underline;
        }

        /* =========================
           HOME
        ========================= */

        .home-link {

            text-align: center;

            margin-top: 14px;
        }

        .home-link a {

            color: #666;

            text-decoration: none;

            font-size: 13px;
        }

        .home-link a:hover {

            color: #11863f;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            body {
                padding: 12px;
            }

            .register-container {
                flex-direction: column;
                min-height: auto;
            }

            .register-left,
            .register-right {
                width: 100%;
            }

            .register-left {
                min-height: 420px;
                padding: 30px 20px;
            }

            .farm-logo {
                width: 125px;
                height: 125px;
            }

            .register-left h1 {
                font-size: 31px;
            }

            .register-left h2 {
                font-size: 18px;
            }

            .register-right {
                padding: 35px 25px;
            }

            .register-right h2 {
                font-size: 27px;
            }
        }

        @media (max-width: 450px) {

            .register-left {
                min-height: 390px;
            }

            .farm-logo {
                width: 110px;
                height: 110px;
            }

            .register-left h1 {
                font-size: 27px;
            }

            .register-right {
                padding: 30px 20px;
            }
        }

    </style>

</head>


<body>


    <div class="register-container">


        <!-- =========================
             LEFT SIDE
        ========================= -->

        <div class="register-left">


            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                class="farm-logo"
                alt="MILKY FARM Logo"
            >


            <h1>
                MILKY FARM
            </h1>


            <div class="farm-line"></div>


            <h2>
                Farm to Customer
            </h2>


            <p>
                Join MILKY FARM and enjoy fresh,
                quality dairy products delivered
                with care.
            </p>


        </div>


        <!-- =========================
             RIGHT SIDE
        ========================= -->

        <div class="register-right">


            <h2>
                Create Account 🥛
            </h2>


            <p class="register-subtitle">
                Register to start ordering from MILKY FARM
            </p>


            <form
                method="POST"
                action="/register"
            >


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>


            </form>


            <!-- LOGIN -->

            <div class="login-text">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </div>


            <!-- HOME -->

            <div class="home-link">

                <a href="/">
                    ← Back to Home
                </a>

            </div>


        </div>


    </div>


</body>

</html>
